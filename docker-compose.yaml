services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: insiderone-devops-app:local
    ports:
      - "8000:8000"
    environment:
      APP_VERSION: "0.1.0"
      GIT_SHA: "${GIT_SHA:-local}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)",
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
