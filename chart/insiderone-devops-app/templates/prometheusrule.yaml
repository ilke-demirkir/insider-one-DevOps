{{- if .Values.alerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "insiderone-devops-app.fullname" . }}
  labels:
    {{- include "insiderone-devops-app.labels" . | nindent 4 }}
    {{- with .Values.alerts.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: {{ include "insiderone-devops-app.fullname" . }}.rules
      rules:
        {{- if .Values.alerts.rules.highErrorRate.enabled }}
        - alert: InsiderOneAppHighErrorRate
          expr: sum(rate(http_requests_total{status=~"5.."}[5m])) > {{ .Values.alerts.rules.highErrorRate.threshold }}
          for: {{ .Values.alerts.rules.highErrorRate.for }}
          labels:
            severity: {{ .Values.alerts.rules.highErrorRate.severity | quote }}
          annotations:
            summary: "FastAPI app is returning 5xx responses"
            description: "The app has returned at least one 5xx response within the last 5 minutes."
        {{- end }}
{{- end }}
