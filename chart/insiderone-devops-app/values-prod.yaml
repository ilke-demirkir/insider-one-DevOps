replicaCount: 2

image:
  repository: ghcr.io/OWNER/insiderone-devops-app
  tag: "0.1.0"
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: app.insiderone.local
      paths:
        - path: /
          pathType: Prefix

config:
  appVersion: "0.1.0"
  gitSha: replace-with-release-sha

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
